          echo '${{ secrets.GMAIL_CREDENTIALS }}' > {"installed":{"client_id":"741856190365-8tt9s37b6go7o6obkj511cfc5mbku1i8.apps.googleusercontent.com","project_id":"nyhetsagent","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token","auth_provider_x509_cert_url":"https://www.googleapis.com/oauth2/v1/certs","client_secret":"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","redirect_uris":["http://localhost"]}}

      - name: Kjør nyhetsagent
        env:
          EMAIL_TO:               ${{ bmrist@gmail.com }}
          ANTHROPIC_KEY:          ${{ secrets.ANTHROPIC_KEY }}
          SPOTIFY_CLIENT_ID:      ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET:  ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          ENABLED_FEEDS:          ${{ secrets.ENABLED_FEEDS }}
        run: node agent.js ${{ steps.mode.outputs.mode }}

      - name: Rydd opp hemmeligheter
        if: always()
        run: rm -f gmail_token.json credentials.json
