name: Nyhetsagent

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode'
        required: true
        default: 'alerts'
        type: choice
        options:
          - alerts
          - morning
          - evening
          - weekly

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Copy sent-log to tmp
        run: |
          if [ -f data/sent.json ]; then
            cp data/sent.json /tmp/nyhetsagent_sent.json
            echo "Gjenopprettet sent-logg ($(wc -c < data/sent.json) bytes)"
          else
            echo "Ingen tidligere sent-logg funnet"
          fi

      - name: Write Gmail files
        run: |
          echo '${{ secrets.GMAIL_TOKEN }}' > gmail_token.json
          echo '${{ secrets.GMAIL_CREDENTIALS }}' > credentials.json

      - name: Run agent
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          ENABLED_FEEDS: ${{ secrets.ENABLED_FEEDS }}
        run: node agent.js ${{ github.event.inputs.mode }}

      - name: Mark morning as sent
        if: github.event.inputs.mode == 'morning'
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          mkdir -p data
          echo "$TODAY" > data/morning_sent.txt
          git config user.name "Nyhetsagent"
          git config user.email "nyhetsagent@github"
          git add data/morning_sent.txt
          git diff --staged --quiet || git commit -m "Morning sent $TODAY [skip ci]"
          git push

      - name: Mark evening as sent
        if: github.event.inputs.mode == 'evening'
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          mkdir -p data
          echo "$TODAY" > data/evening_sent.txt
          git config user.name "Nyhetsagent"
          git config user.email "nyhetsagent@github"
          git add data/evening_sent.txt
          git diff --staged --quiet || git commit -m "Evening sent $TODAY [skip ci]"
          git push

      - name: Save sent-log to repo
        if: always()
        run: |
          if [ -f /tmp/nyhetsagent_sent.json ]; then
            mkdir -p data
            cp /tmp/nyhetsagent_sent.json data/sent.json
            git config user.name "Nyhetsagent"
            git config user.email "nyhetsagent@github"
            git add data/sent.json
            git diff --staged --quiet || git commit -m "Update sent-log [skip ci]"
            git push
            echo "Sent-logg lagret ($(wc -c < data/sent.json) bytes)"
          else
            echo "Ingen sent-logg å lagre"
          fi

      - name: Cleanup
        if: always()
        run: rm -f gmail_token.json credentials.json
