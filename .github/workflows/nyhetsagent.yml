name: Nyhetsagent

on:
  schedule:
    # Morgenoppsummering kl. 07:00 Oslo (05:00 UTC sommertid)
    - cron: '0 5 * * *'
    # Kveldoppsummering kl. 22:00 Oslo (20:00 UTC sommertid)
    - cron: '0 20 * * *'
    # Varsler hver 2. time mellom 08:00–20:00 Oslo (06:00–18:00 UTC sommertid)
    - cron: '0 6,8,10,12,14,16,18 * * *'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Kjøringsmodus'
        required: true
        default: 'alerts'
        type: choice
        options: [alerts, morning, evening, weekly]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Sjekk ut kode
        uses: actions/checkout@v4

      - name: Last ned sent-cache (unngår duplikater på tvers av kjøringer)
        uses: actions/cache@v4
        with:
          path: /tmp/nyhetsagent_*.json
          key: nyhetsagent-sent-${{ github.run_id }}
          restore-keys: |
            nyhetsagent-sent-

      - name: Sett opp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bestem kjøringsmodus
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          HOUR=$(date -u +%H)
          echo "UTC-time: $HOUR"
          if [ "$HOUR" = "05" ]; then
            echo "mode=morning" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "20" ]; then
            echo "mode=evening" >> $GITHUB_OUTPUT
          else
            echo "mode=alerts" >> $GITHUB_OUTPUT
          fi

      - name: Skriv Gmail-filer
        run: |
          echo '${{ secrets.GMAIL_TOKEN }}' > {
  "access_token": "ya29.a0AdMD6Egn9UcJDNwN8nPWMBeEEUUonZh-yOYBSHovXYhtLMNQ-qB4PW9X5MjGVihpWtjqaukAYXqPsYbawdoJT3QsmD48Afzt2crJbbkrRvM-tJy89LvJoxsNAPjfzasiceWcWYY6Xd9HDhS6YyxNobw0HbmdL65J_UJV9IXmOOzvw7Fn42Gss6Xvire-JQxn5F_px8saCgYKAfQSARISFQHGX2MiMUQj-KagwDkKNK2sxwsqlg0206",
  "expires_in": 3599,
  "refresh_token": "1//0c-Rdu913IboPCgYIARAAGAwSNwF-L9IrCbgKOIOupb_pO4HfkdnraAdOPU9VLqwUNIaMO8wKABn-Phq-MDh5jifRweyTIXZPi4k",
  "scope": "https://www.googleapis.com/auth/gmail.send",
  "token_type": "Bearer",
  "refresh_token_expires_in": 604799,
