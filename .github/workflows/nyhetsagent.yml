name: Nyhetsagent

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 21 * * *'
    - cron: '0 7,9,11,13,15,17,19 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode'
        required: true
        default: 'alerts'
        type: choice
        options:
          - alerts
          - morning
          - evening
          - weekly

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache sent-log
        uses: actions/cache@v4
        with:
          path: /tmp/nyhetsagent_*.json
          key: nyhetsagent-sent-${{ github.run_id }}
          restore-keys: |
            nyhetsagent-sent-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          HOUR=$(date -u +%H)
          echo "UTC hour: $HOUR"
          if [ "$HOUR" = "05" ]; then
            echo "mode=morning" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "20" ]; then
            echo "mode=evening" >> $GITHUB_OUTPUT
          else
            echo "mode=alerts" >> $GITHUB_OUTPUT
          fi

      - name: Write Gmail files
        run: |
          echo '${{ secrets.GMAIL_TOKEN }}' > gmail_token.json
          echo '${{ secrets.GMAIL_CREDENTIALS }}' > credentials.json

      - name: Run agent
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          ENABLED_FEEDS: ${{ secrets.ENABLED_FEEDS }}
        run: node agent.js ${{ steps.mode.outputs.mode }}

      - name: Cleanup
        if: always()
        run: rm -f gmail_token.json credentials.json
