name: Nyhetsagent

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 21 * * *'
    - cron: '0 7,9,11,13,15,17,19 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode'
        required: true
        default: 'alerts'
        type: choice
        options:
          - alerts
          - morning
          - evening
          - weekly

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Copy sent-log to tmp
        run: |
          if [ -f data/sent.json ]; then
            cp data/sent.json /tmp/nyhetsagent_sent.json
            echo "Gjenopprettet sent-logg ($(wc -c < data/sent.json) bytes)"
          else
            echo "Ingen tidligere sent-logg funnet"
          fi

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          HOUR=$(date -u +%H)
          echo "UTC hour: $HOUR"
          # Morgen: 06 eller 07 UTC (07:00-08:00 norsk vintertid, buffer for forsinkelse)
          if [ "$HOUR" = "06" ] || [ "$HOUR" = "07" ]; then
            # Sjekk at det ikke allerede er sendt morgenoppsummering i dag
            TODAY=$(date -u +%Y-%m-%d)
            if [ -f data/morning_sent.txt ] && grep -q "$TODAY" data/morning_sent.txt 2>/dev/null; then
              echo "Morgenoppsummering allerede sendt i dag – kjorer alerts"
              echo "mode=alerts" >> $GITHUB_OUTPUT
            else
              echo "mode=morning" >> $GITHUB_OUTPUT
            fi
          # Kveld: 21 UTC (22:00 norsk vintertid)
          elif [ "$HOUR" = "21" ] || [ "$HOUR" = "22" ]; then
            echo "mode=evening" >> $GITHUB_OUTPUT
          else
            echo "mode=alerts" >> $GITHUB_OUTPUT
          fi

      - name: Write Gmail files
        run: |
          echo '${{ secrets.GMAIL_TOKEN }}' > gmail_token.json
          echo '${{ secrets.GMAIL_CREDENTIALS }}' > credentials.json

      - name: Run agent
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          ENABLED_FEEDS: ${{ secrets.ENABLED_FEEDS }}
        run: node agent.js ${{ steps.mode.outputs.mode }}

      - name: Mark morning as sent
        if: steps.mode.outputs.mode == 'morning'
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          mkdir -p data
          echo "$TODAY" > data/morning_sent.txt
          git config user.name "Nyhetsagent"
          git config user.email "nyhetsagent@github"
          git add data/morning_sent.txt
          git diff --staged --quiet || git commit -m "Mark morning sent $TODAY [skip ci]"
          git push

      - name: Save sent-log to repo
        if: always()
        run: |
          if [ -f /tmp/nyhetsagent_sent.json ]; then
            mkdir -p data
            cp /tmp/nyhetsagent_sent.json data/sent.json
            git config user.name "Nyhetsagent"
            git config user.email "nyhetsagent@github"
            git add data/sent.json
            git diff --staged --quiet || git commit -m "Update sent-log [skip ci]"
            git push
            echo "Sent-logg lagret ($(wc -c < data/sent.json) bytes)"
          else
            echo "Ingen sent-logg å lagre"
          fi

      - name: Cleanup
        if: always()
        run: rm -f gmail_token.json credentials.json
