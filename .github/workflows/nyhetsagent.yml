name: Nyhetsagent

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 21 * * *'
    - cron: '0 7,9,11,13,15,17,19 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode'
        required: true
        default: 'alerts'
        type: choice
        options:
          - alerts
          - morning
          - evening
          - weekly

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore sent-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/nyhetsagent_sent.json
          key: nyhetsagent-sent-v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          HOUR=$(date -u +%H)
          echo "UTC hour: $HOUR"
          if [ "$HOUR" = "06" ]; then
            echo "mode=morning" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "21" ]; then
            echo "mode=evening" >> $GITHUB_OUTPUT
          else
            echo "mode=alerts" >> $GITHUB_OUTPUT
          fi

      - name: Write Gmail files
        run: |
          echo '${{ secrets.GMAIL_TOKEN }}' > gmail_token.json
          echo '${{ secrets.GMAIL_CREDENTIALS }}' > credentials.json

      - name: Run agent
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          ENABLED_FEEDS: ${{ secrets.ENABLED_FEEDS }}
        run: node agent.js ${{ steps.mode.outputs.mode }}

      - name: Save sent-cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: /tmp/nyhetsagent_sent.json
          key: nyhetsagent-sent-v1-${{ github.run_id }}

      - name: Cleanup
        if: always()
        run: rm -f gmail_token.json credentials.json

      - name: Notify on failure
        if: failure()
        run: |
          echo "Workflow feilet - sjekk loggen over for instruksjoner"
          echo "Mest sannsynlig er Gmail-token utlopt og ma fornyes"
